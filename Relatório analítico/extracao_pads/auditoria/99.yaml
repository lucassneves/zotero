  - id: 36
    chave: "limitacoes"
    valor: "Seção Discussion - Limitations (p. 36-37) e Methods (p. 12-17): (1) estudo retrospectivo de caso-controle restrito a controles saudáveis, sem grupo de controle sintomático para diagnóstico diferencial (tremor essencial, parkinsonismo atípico/vascular/induzido por fármacos etc.); (2) coorte de teste interna, pequena (n=90), balanceada e apenas com casos completos (complete-case), não refletindo a prevalência real de triagem e sujeita a viés de completude de tarefas; (3) heterogeneidade de recrutamento e efeitos de dispositivos não auditados por modelo de smartphone ou sistema operacional; (4) ausência de calibração de probabilidades; (5) benchmarking em bases públicas (PADS e WearGait-PD) via retreinamento do workflow, e não validação externa com modelo congelado; (6) ausência de registro consistente do estado medicamentoso dopaminérgico (ON/OFF) e do estágio de Hoehn e Yahr, além de MDS-UPDRS III disponível para apenas 21,8% do grupo PD."
    status: "explícito"
    confianca: "alta"
    evidencia: "Discussion - Limitations, p. 36 — 'This was a retrospective case–control model-development study, not a diagnostic validation study. The control group consisted of neurologist-confirmed healthy controls rather than symptomatic differential-diagnosis controls...'"
    auditoria: "CONCORDA"
    observacao: null
  - id: 37
    chave: "lacuna"
    valor: "Seção Discussion - Future Work (p. 37): realizar validação externa prospectiva multicêntrica em populações representativas de triagem e múltiplos smartphones/sistemas operacionais; incluir controles sintomáticos não-PD (diagnóstico diferencial); registrar sistematicamente estado de medicação (ON/OFF), estágio da doença, modelo de dispositivo e motivos de falha/ausência de tarefas; calibrar probabilidades sob prevalência real e avaliar utilidade clínica com análise de curva de decisão (decision-curve analysis); e investigar a relação da tarefa PinchToSize com subescores clínicos de destreza (MDS-UPDRS III) e qualidade de vida (PDQ-8)."
    status: "explícito"
    confianca: "alta"
    evidencia: "Discussion - Future Work, p. 37 — 'Future work should prioritise prospective multisite external validation across diverse smartphones, operating systems, clinical settings, and representative screening populations. Such studies should include symptomatic non-PD controls...'"
    auditoria: "CONCORDA"
    observacao: null
