pontos_para_revisao_humana:
  - "Campo 14 (n_participantes = 390): status inferido a partir da soma explícita de 276 PD e 114 DD descrita na Seção III-A (p. 6)."
  - "Campo 31 e QA4: os autores reportam Macro-Recall ('macro-recall', coluna 'Rec' na Tabela IV) em um problema binário (PD vs. DD), o que equivale matematicamente à média entre Sensitivity e Specificity (Balanced accuracy), mas como não usam esse rótulo nem reportam Specificity separadamente, foi pontuado como 0.5 (Partially) em QA4."
  - "Campo aux_preproc_apenas_treino e QA3: verificar no código do GitHub se a busca de K no intervalo (2, 23) e a normalização Z-score foram restritas aos folds de treino."
