derivados:
  aux_preproc_apenas_treino:
    valor: "Não reportado"
    status: "não reportado"
    confianca: "alta"
    evidencia: "Seção II-B, p. 4 (6031) e Seção III-B, p. 6 (6033) — 'We apply a band-pass filter (0.3 to 20 Hz) and Z-score standardization... learning rate selected from 5 x 10^{-3} or 5 x 10^{-4}, and the predefined number of domain distributions K is chosen from the range (2, 23).'"
    observacao: "Embora o Algoritmo 1 indique o pré-processamento no estágio de treinamento sobre D^{tr}, o texto não explicita se a média/desvio-padrão do Z-score foram ajustados apenas nos folds de treino ou por gravação, nem se a escolha dos hiperparâmetros (learning rate e número de domínios K entre 2 e 23) usou um subconjunto de validação separado do fold de teste."
  risco_vazamento:
    valor: "Moderado"
    regra: "campo 26 = Participante; 27 = Sim – explícita; 28 = Não se aplica; aux_preproc_apenas_treino = Não reportado"
  qa:
    QA1:
      resposta: "Yes"
      nota: 1.0
      campos: [16, 15]
      justificativa: "O cenário de classificação no PADS (PD×DD) e os tamanhos dos grupos (276 PD e 114 DD) estão claramente definidos."
    QA2:
      resposta: "Yes"
      nota: 1.0
      campos: [8, 9, 11, 13, 14]
      justificativa: "Todos os cinco itens do recorte do PADS (modalidade IMU, todas as 14 tarefas, acelerômetro e giroscópio, punho direito e N=390 participantes) estão informados."
    QA3:
      resposta: "Partially"
      nota: 0.5
      campos: [26, 27, 28]
      justificativa: "Há separação explícita por participante no 4-fold CV, mas não há confirmação de isolamento do conjunto de teste durante a padronização Z-score e a seleção do hiperparâmetro K (risco de vazamento Moderado)."
    QA4:
      resposta: "Partially"
      nota: 0.5
      campos: [31]
      justificativa: "Reporta Macro-F1 (uma métrica robusta explícita na lista do protocolo), além de Accuracy, Macro-Precision e Macro-Recall, mas não reporta segunda métrica robusta isolada da lista (como Balanced accuracy, MCC, AUC ou o par Sensitivity + Specificity)."
    QA5:
      resposta: "Yes"
      nota: 1.0
      campos: [35, 22, 29]
      justificativa: "Disponibiliza o código em repositório público no GitHub e descreve a arquitetura, o pré-processamento e os hiperparâmetros principais."
  nota_qa: 4.0
  nota_qa_max: 5
  faixa_qa: "Alta"
