derivados:
  aux_preproc_apenas_treino:
    valor: "Não reportado"
    status: "não reportado"
    confianca: "alta"
    evidencia: "Seção 2.3, p. 3 — 'Data were standardized using the z-score transformation, and the SMOTE (Synthetic Minority Over-sampling Technique) was applied to the training set'"
    observacao: "O SMOTE foi explicitamente aplicado apenas ao conjunto de treino ('applied to the training set'), porém o artigo não especifica se a padronização z-score foi ajustada exclusivamente nos conjuntos de treino de cada dobra do 5-fold CV (observando-se ainda comparação manual de subconjuntos de atributos na mesma CV sem teste aninhado)."
  risco_vazamento:
    valor: "Moderado"
    regra: "campo 26 = Participante; campo 27 = Sim – inferida; campo 28 = Só no treino; aux_preproc_apenas_treino = Não reportado"
  qa:
    QA1:
      resposta: "Yes"
      nota: 1.0
      campos: [16, 15]
      justificativa: "Três cenários binários (PD×CO, PD×DD e DD×CO) e os tamanhos dos grupos no PADS (276 PD, 114 DD, 79 CO) estão claramente definidos."
    QA2:
      resposta: "Yes"
      nota: 1.0
      campos: [8, 9, 11, 13, 14]
      justificativa: "Todos os itens aplicáveis do recorte (modalidade IMU/lateralidade, 11 tarefas, acelerômetro e giroscópio, ambos os punhos/dominante e N=469) estão descritos."
    QA3:
      resposta: "Partially"
      nota: 0.5
      campos: [26, 27, 28]
      justificativa: "Separação por participante inferida (1 vetor por sujeito) e SMOTE restrito ao treino, mas não explicita se a padronização z-score foi ajustada apenas nas dobras de treino (risco Moderado)."
    QA4:
      resposta: "Partially"
      nota: 0.5
      campos: [31]
      justificativa: "Reporta apenas uma métrica robusta ao desbalanceamento (Balanced accuracy), além de Accuracy e F1 ponderado (weighted F1-score)."
    QA5:
      resposta: "No"
      nota: 0.0
      campos: [35, 22, 29]
      justificativa: "Não disponibiliza código e não descreve os hiperparâmetros dos classificadores nem os parâmetros do SMOTE."
  nota_qa: 3.0
  nota_qa_max: 5
  faixa_qa: "Média"
