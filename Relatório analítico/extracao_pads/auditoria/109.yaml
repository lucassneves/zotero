pontos_para_revisao_humana:
  - "Campo 2 (ano_publicacao): o PDF não contém cabeçalho/rodapé com ano ou DOI; '2025' foi obtido do metadado do arquivo Zotero."
  - "Campos 26 e 27 (unidade_particionamento e separacao_participante): marcados como 'Participante' e 'Sim – inferida' porque a Eq. 2 (Seção 2.2) constrói um único vetor de 924 atributos por participante concatenando todas as tarefas, punhos e sensores."
  - "aux_preproc_apenas_treino e QA3: reclassificado após revisão humana para 'Não reportado' (risco Moderado, QA3=0.5), mantendo-se coerência com estudos que omitem o escopo do z-score e registram seleção manual de subconjuntos na CV."
  - "Campo 33 (melhor_resultado): extraído o maior valor da Tabela 1 (DD×HC; Extra Trees; Balanced accuracy; 82.48%), embora a conclusão destaque 74.31% (PD×HC; LightGBM)."
