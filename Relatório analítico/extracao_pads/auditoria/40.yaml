pontos_para_revisao_humana:
  - "Campo 2 (ano_publicacao): o cabeçalho indica 'Cognitive Computation (2026) 18:3', porém DOI (s12559-025-10533-y), copyright (2025) e publicação online (20 December 2025) são de 2025."
  - "Campo 8 (modalidade_pads): o texto afirma nas p. 4, 5 (Algoritmo 1) e 14 que dados não motores do questionário e atributos demográficos/histórico clínico alimentam o módulo condicional da GAN, mas na p. 7/15 enfatiza categorias de tarefa (0, 1, 2) e na p. 18 cita a integração de metadados clínicos como trabalho futuro."
  - "Campos 24, 26, 27 e 28 (validação e vazamento): a Tabela 2 (p. 14) reporta 10-fold CV e a p. 15 explicita 'preserving the subject-wise split and preventing any leakage' com geração sintética exclusiva para sujeitos de treino; confirmar se o treinamento da própria GAN também foi reexecutado por dobra do 10-fold CV."
  - "Campo aux_preproc_apenas_treino e QA3: normalização z (p. 11) e ajuste de GMM (p. 15) são explicitamente restritos ao conjunto de treino (confiança média por não detalhar o ajuste do XceptionTime/BOSS por dobra na Tabela 2)."
  - "Campo 33 (melhor_resultado): na Tabela 2 (p. 14), o melhor modelo individual em HC vs. PD é BOSS + SVM (0.876±0.014), enquanto o Resumo destaca a média dos 9 modelos (80.1% em HC vs. PD e 68.6% em PD vs. DD), e a p. 15 reporta 90.6% de Accuracy (macro-F1 = 0.876) com new-individual synthesis sem especificar o classificador ou par de classes."
  - "QA5 (replicabilidade): arquiteturas e hiperparâmetros da GAN estão detalhados na Tabela 1 (p. 9-10), mas não há código disponível nem hiperparâmetros dos classificadores da Tabela 2."
