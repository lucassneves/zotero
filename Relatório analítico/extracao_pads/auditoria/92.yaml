    observacao: "O artigo menciona apenas 5-fold CV estratificado por categoria, sem declarar divisão por participante (Regra 9 -> 'Pouco claro'). Ademais, a presença de 48 HC e 45 DD na dobra de validação (Figuras 6b, 7b e 10b) evidencia que as cópias aumentadas dos 79 HC (237 amostras) e 114 DD (228 amostras) foram geradas antes da divisão em 5 dobras, permitindo que amostras originais e aumentadas do mesmo sujeito fiquem em treino e validação simultaneamente."
