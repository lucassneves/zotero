  - "Campo 28 (momento_balanceamento) e QA3: embora a Seção 2.2 diga genericamente que o data augmentation foi aplicado 'during training', a expansão para 276 PD, 237 HC (79×3) e 228 DD (114×2) ocorreu antes do 5-fold CV, como comprovam a Seção 2.4 (p. 9) e as matrizes de confusão de validação (Figuras 6b, 7b e 10b, p. 10 e 12), que contêm 48 HC e 45 DD em uma única dobra (20% das amostras aumentadas)."
  - "Campos 26 e 27: o artigo não declara a unidade de particionamento do 5-fold CV nem separação por participante, e o sorteio sobre o conjunto aumentado (741 amostras de 469 sujeitos) implica vazamento de cópias aumentadas do mesmo participante entre treino e validação."
  - "Campo 31 e QA4: no cenário de 3 classes (PD×HC×DD), o artigo reporta Precision (82.13%), Recall (75.71%) e F1 (76.02%) sem especificar se a agregação foi macro ou ponderada."
  - "QA5: hiperparâmetros principais estão na Tabela 4 (p. 12), mas não há disponibilização de código-fonte (Data Availability Statement, p. 15)."
