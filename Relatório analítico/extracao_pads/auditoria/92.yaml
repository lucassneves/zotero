derivados:
  aux_preproc_apenas_treino:
    valor: "Não"
    status: "explícito"
    confianca: "alta"
    evidencia: "Seção 2.4, p. 9 e Seção 3, p. 11 — 'The experimental samples contained enhanced data and labels... A 5-fold cross-validation was performed... five-fold cross-validation was incorporated into the hyperparameter optimization process'"
    observacao: "O pré-processamento e o data augmentation (que expandiu o dataset para 276 PD, 237 HC e 228 DD) foram realizados antes da divisão do 5-fold CV, e a seleção de hiperparâmetros e o early stopping utilizaram as próprias dobras de validação."
  risco_vazamento:
    valor: "Alto"
    regra: "campo 28 = Antes do split; aux_preproc_apenas_treino = Não"
  qa:
    QA1:
      resposta: "Yes"
      nota: 1.0
      campos: [16, 15]
      justificativa: "Cenários de classificação (PD×HC, PD×DD e 3 classes) e tamanhos dos grupos do PADS (276 PD, 79 HC, 114 DD) estão claramente definidos."
    QA2:
      resposta: "Yes"
      nota: 1.0
      campos: [8, 9, 11, 13, 14]
      justificativa: "Todos os cinco itens do recorte do PADS (modalidade, tarefas, sensores, punhos e N de participantes) foram reportados."
    QA3:
      resposta: "No"
      nota: 0.0
      campos: [26, 27, 28]
      justificativa: "Risco de vazamento alto: data augmentation aplicado antes da divisão das 5 dobras (confirmado pelas matrizes de confusão) e sem separação explícita por participante."
    QA4:
      resposta: "Partially"
      nota: 0.5
      campos: [31]
      justificativa: "Reporta F1 (além de Accuracy, Precision e Recall/Sensitivity), mas não especifica se o F1 é macro ou ponderado e não reporta Specificity, Balanced accuracy, AUC ou MCC."
    QA5:
      resposta: "Partially"
      nota: 0.5
      campos: [35, 22, 29]
      justificativa: "Arquitetura, pré-processamento e hiperparâmetros (Tabela 4) estão descritos, mas o código não foi disponibilizado."
  nota_qa: 3.0
  nota_qa_max: 5
  faixa_qa: "Média"
