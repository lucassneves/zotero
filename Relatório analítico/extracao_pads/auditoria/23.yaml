pontos_para_revisao_humana:
  - "Ressalva da triagem confirmada (Campos 23, 27, 28 e QA3): o janelamento DHWT usa o rótulo da classe (70% de sobreposição para HC, 0% para PD e 65% para DD) e foi aplicado a todo o dataset (~8.500 janelas por classe), gerando prevalência equalizada de 0,52 (HC vs. PD) e 0,47 (PD vs. DD) nas dobras avaliadas (Seção 5 e Figura 3), o que caracteriza vazamento do rótulo na segmentação de teste."
  - "Campo 15 (n_por_classe): o artigo reporta explicitamente 291 PD, 79 HC e 99 DD (total = 469) nas Seções 3 e 4.2, divergindo da contagem padrão do PADS original (276 PD, 79 HC, 114 DD)."
  - "Derivado aux_preproc_apenas_treino e QA3: além do DHWT global, a busca de hiperparâmetros com Optuna (TPE) e o pré-treinamento auto-supervisionado (Seção 5.9: 'Self-supervised pre-training is performed on the same data used for fine-tuning') não declararam isolamento estrito dentro das dobras de treino."
  - "Campo 33 e Seção 5: os autores reportam que o AUROC no nível de paciente satura em 1,000 para todos os encoders em ambas as tarefas, razão pela qual todas as tabelas reportam métricas no nível de janela."
  - "QA5 e Campo 35: preprint do arXiv sem link de repositório ou declaração de disponibilidade de código."
