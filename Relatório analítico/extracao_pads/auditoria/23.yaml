verificacao_de_coerencia:
  - regra: "Modalidade só Questionário → Sensores null; Tarefas e Punho = Não se aplica"
    resultado: "OK (modalidade é Série temporal (IMU))"
  - regra: "Cenários com 3 classes (Mult-Class) → N por classe com PD, HC e DD maiores que 0"
    resultado: "OK (PD=291; HC=79; DD=99)"
  - regra: "Soma de PD+HC+DD (campo 15) = campo 14, quando ambos preenchidos"
    resultado: "OK (291 + 79 + 99 = 469)"
  - regra: "Campo 26 = Participante → campo 27 = Sim – explícita ou Sim – inferida"
    resultado: "OK (campo 26 = Participante e campo 27 = Sim – explícita)"
  - regra: "Campo 23 = SMOTE-oversampling, Dados sintéticos (GAN) ou Outro → campo 28 diferente de Não se aplica e campo 29 preenchido"
