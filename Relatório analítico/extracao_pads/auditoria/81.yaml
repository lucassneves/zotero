derivados:
  aux_preproc_apenas_treino:
    valor: "Não reportado"
    status: "não reportado"
    confianca: "alta"
    evidencia: "Seção IV, p. 3 e Seção V-B, p. 4 — 'then the signals are standardized by z scores' / 'All input features were normalized to have unit variance before training.'"
    observacao: "O artigo afirma que os atributos foram normalizados para variância unitária 'before training' (Seção V-B, p. 4) em um pipeline unificado (Seção V, p. 4), mas também menciona na Seção VI (p. 5) que as partições de teste não foram envolvidas no processo de treinamento. Como não explicita se os parâmetros de normalização (média/variância entre sujeitos) foram ajustados exclusivamente no conjunto de treino, marca-se Não reportado."
  risco_vazamento:
    valor: "Moderado"
    regra: "campo 26 = Participante; campo 27 = Sim – explícita; campo 28 = Só no treino; aux_preproc_apenas_treino = Não reportado"
  qa:
    QA1:
      resposta: "Partially"
      nota: 0.5
      campos: [16, 15]
      justificativa: "O cenário binário PD×HC é explícito (campo 16), mas o artigo não informa o N efetivo por classe no experimento após exclusão de DD e 'error data' (campo 15 null) e traz números divergentes da base na Seção III-A."
    QA2:
      resposta: "Partially"
      nota: 0.5
      campos: [8, 9, 11, 13, 14]
      justificativa: "Quatro dos cinco itens estão informados (modalidade, tarefas, sensores e punhos), mas o N efetivo de participantes do experimento (campo 14) não é reportado."
    QA3:
      resposta: "Partially"
      nota: 0.5
      campos: [26, 27, 28]
      justificativa: "Há separação explícita por participante (80/20 subject-wise split) e pesos de classe no treino, mas não é reportado se a normalização de atributos foi ajustada apenas no treino (risco_vazamento = Moderado)."
    QA4:
      resposta: "Partially"
      nota: 0.5
      campos: [31]
      justificativa: "Reporta Accuracy, Precision, Sensitivity (Recall) e F1, sem indicar F1 macro/ponderado e sem Balanced accuracy, MCC ou AUC."
    QA5:
      resposta: "Partially"
      nota: 0.5
      campos: [35, 22, 29]
      justificativa: "Descreve pré-processamento, arquiteturas e hiperparâmetros principais (campos 22 e 29), mas não disponibiliza código ou repositório (campo 35 = Não reportado)."
