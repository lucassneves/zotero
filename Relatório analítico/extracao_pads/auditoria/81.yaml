pontos_para_revisao_humana:
  - "Campos 14 e 15 (n_participantes e n_por_classe): a Seção III-A descreve o PADS completo com 469 sujeitos mas com contagens por grupo divergentes da base canônica (298 PD, 96 HC e 75 DD) e não informa o N efetivo usado no experimento PD×HC após excluir DD e 'error data' (o teste tem 71 amostras na Seção III-B e 70 amostras [57 PD, 13 HC] na Fig. 4)."
  - "Campo 8 (modalidade_pads): contradição interna sobre a variável idade — a Seção IV (p. 3) diz que 'age variables' foram excluídas para reduzir viés, mas a Seção III-B (p. 2) cita a idade como o atributo mais importante no Random Forest e a Fig. 2 (p. 4) inclui 'Age of Diagnosis' no ramo de séries temporais."
  - "Campos 24, 26, 27 e QA3: a Seção IV (p. 3) declara explicitamente 'subject wise stratified 80/20 split', enquanto a Seção IV-A (p. 4) menciona 5-fold CV sem explicitar agrupamento por participante, e a Seção V-B (p. 4) cita normalização de variância unitária 'before training' sem esclarecer se foi ajustada apenas no treino."
  - "Campos 31, 33 e 34: na Fig. 4 (p. 5), as matrizes de confusão de CNN e BiLSTM preveem todas as 70 amostras de teste como PD (57 TP e 13 FP, o que daria 57/70 = 81.43% de acurácia), divergindo das acurácias reportadas na Tabela II (78.6% para CNN e 77.1% para BiLSTM)."
  - "QA5 e campo 22 (especificacao_algoritmo): na Seção V-B (p. 4), o texto menciona 'regularization parameter was set to =10. 0' em uma frase e logo em seguida 'trained using a regularization parameter C = 1.0'."
