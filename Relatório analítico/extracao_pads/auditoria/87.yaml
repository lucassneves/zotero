    valor: "Não"
    status: "inferido"
    confianca: "alta"
    evidencia: "Seção IV-C, p. 6 (46143) e Seção V-A, p. 7 (46144) — 'The noise is scaled relative to the standard deviation of each channel’s data... The augmented data, along with the original samples, were stored in the same binary format' e 'Each inner fold contains 352 samples for training and 89 samples for validation'"
    observacao: "Embora o ajuste de hiperparâmetros tenha sido isolado no loop interno da validação cruzada aninhada (Seção V-A), o pré-processamento e o data augmentation da classe HC (que utiliza o desvio-padrão de cada canal e gera amostras extras) foram executados e salvos em formato binário único antes da divisão dos folds."
  risco_vazamento:
    valor: "Alto"
    regra: "campo 28 = Antes do split; aux_preproc_apenas_treino = Não"
  qa:
    QA1:
      resposta: "Yes"
      nota: 1.0
      campos: [16, 15]
      justificativa: "Cenário binário PD×HC claramente definido, com N por classe explícito (276 PD, 79 HC) e exclusão explícita de DD."
    QA2:
      resposta: "Yes"
      nota: 1.0
      campos: [8, 9, 11, 13, 14]
      justificativa: "Todos os itens aplicáveis do recorte do PADS foram informados (modalidade IMU, 8 tarefas, acelerômetro/giroscópio, ambos os punhos e N=355 participantes)."
    QA3:
      resposta: "No"
      nota: 0.0
      campos: [26, 27, 28]
      justificativa: "Risco de vazamento Alto devido à aplicação de data augmentation na classe HC antes da divisão em folds (gerando ~551 amostras partilhadas entre treino e teste) e falta de separação explícita por participante."
    QA4:
