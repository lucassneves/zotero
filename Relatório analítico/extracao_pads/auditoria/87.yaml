    evidencia: "Seção V-A, p. 7 (46144) — 'Each inner fold contains 352 samples for training and 89 samples for validation'; termos buscados: subject-wise, patient-wise, group, participant split; nenhum trecho encontrado."
    auditoria: "CONCORDA"
    observacao: "Embora na arquitetura principal os 11 segmentos × 2 punhos × 6 eixos componham um tensor 132×976 por amostra (Fig. 2), o artigo aplica data augmentation na classe HC antes de salvar o arquivo binário (Seção IV-C) e particiona o conjunto resultante em folds de '352 samples for training and 89 samples for validation' (441 amostras no loop interno = 4/5 de ~551 amostras pós-augmentation), sem agrupamento por participante, de modo que amostras originais e aumentadas do mesmo participante HC são sorteadas como amostras independentes. Além disso, na Seção V-F avalia movimentos individuais sem detalhar o particionamento."
  - id: 27
    chave: "separacao_participante"
    valor: "Pouco claro"
    status: "não reportado"
    confianca: "alta"
    evidencia: "Seção V-A, p. 7 (46144) — 'the data is divided into five outer folds, and for each outer fold, there are five inner folds. Each inner fold contains 352 samples for training and 89 samples for validation'"
    auditoria: "CONCORDA"
    observacao: "O texto não declara divisão por participante (subject-wise/patient-wise). Além disso, como o número de amostras no loop interno (352 + 89 = 441, correspondendo a 4/5 de ~551 amostras) excede os 355 participantes originais (276 PD + 79 HC), infere-se que cópias aumentadas dos mesmos indivíduos HC compuseram o pool dividido na validação cruzada, inviabilizando a independência entre treino e teste para os participantes HC."
  - id: 28
    chave: "momento_balanceamento"
