    auditoria: "CONCORDA"
    observacao: "Na Seção IV-C os autores descrevem que os dados aumentados da classe HC foram gerados e armazenados junto às amostras originais no arquivo binário. Na Seção V-A, cada inner fold (4/5 do conjunto completo) contém 352 + 89 = 441 amostras, o que implica um total de ~551–552 amostras antes da divisão em 5 outer folds (276 PD + ~275–276 HC após augmentation, em vez dos 355 participantes originais), comprovando que o balanceamento por augmentation ocorreu antes do split."
  - id: 29
    chave: "detalhes_balanceamento"
    valor: "Data augmentation aplicado seletivamente apenas às amostras da classe HC: random scaling (fator aleatório entre 0.8 e 1.2), random rotation (rotação com ângulos de Euler aleatórios nos eixos X, Y e Z) e adição de ruído gaussiano (escalado pelo desvio-padrão de cada canal)."
    status: "explícito"
    confianca: "alta"
    evidencia: "Seção IV-C, p. 6 (46143) — 'random scaling modifies the magnitude... range of 0.8 to 1.2... Random rotation... Euler angles along the \"X,\" \"Y,\" and \"Z\" axes... Gaussian noise [40] is added... selectively applied only to the HC samples'"
