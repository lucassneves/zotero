  - id: 36
    chave: "limitacoes"
    valor: "Ausência de graduação de severidade no PADS, o que impede a detecção estratificada entre estágios iniciais e avançados (Seção V-A, p. 7); variabilidade demográfica e clínica relativamente estreita do dataset, podendo afetar a generalização; desafios de implantação no mundo real devido a diferenças no posicionamento do sensor; menor sensibilidade das tarefas estáticas para detectar características sutis de tremor (Seção VI, p. 11)."
    status: "explícito"
    confianca: "alta"
    evidencia: "Seção V-A, p. 7 (46144) — 'PADS dataset does not currently provide severity grading for PD' e Seção VI, p. 11 (46148) — 'limitations, including a relatively narrow demographic and clinical variability... sensor placement differences... static tasks... reduced sensitivity'"
    auditoria: "CONCORDA"
    observacao: null
