derivados:
  aux_preproc_apenas_treino:
    valor: "Sim"
    status: "explícito"
    confianca: "alta"
    evidencia: "Seção 3.3.2, p. 6 — 'All features were standardised using z-score normalisation computed on the training partition only'; Seção 3.6.4, p. 7 — '10% of the outer-training recordings'"
    observacao: "O artigo detalha explicitamente que a padronização z-score (Eq. 9, p. 6), os pesos de classe inversos à frequência, o early stopping (10% do treino externo, p. 7), a calibração isotônica (CalibratedClassifierCV com 3 folds internos no treino externo, p. 7) e o SMOTE nos experimentos auxiliares (p. 6 e 9) foram todos ajustados exclusivamente nas partições de treino de cada fold. A única ressalva menor declarada pelos autores na Seção 3.5 (p. 6) e 6.7 (p. 22) é que o peso 60:40 do ensemble e a remoção de 10 atributos cross-axis vieram de estágio exploratório/heurístico de desenvolvimento."
  risco_vazamento:
