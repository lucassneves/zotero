  - id: 36
    chave: "limitacoes"
    valor: "Seção 6.7 (p. 22): (1) Os protocolos de segmentação, agregação e seleção de modelo não foram totalmente equiparados entre os dois pipelines, os pesos do ensemble (60:40) foram fixados heuristicamente e a arquitetura profunda não passou por busca exaustiva de hiperparâmetros; (2) Experimentos restritos ao PADS sob condições controladas em único smartwatch, sem avaliar vida livre, progressão longitudinal, variação de medicação, heterogeneidade de dispositivos ou módulo dedicado de remoção de artefatos/ruído; (3) Possível confusão demográfica (idade, idade no diagnóstico, peso e altura influenciaram fortemente os modelos e o ramo demográfico da rede profunda), sem análise de subgrupos ou calibração por estratos; (4) Explicabilidade SHAP restrita ao componente XGBoost e correlacional (não causal); (5) Segmentação com sobreposição introduziu dependência temporal intra-gravação e o conjunto held-out na análise multi-seed do CNN-LSTM foi usado para monitorar early stopping; (6) Ausência de benchmark com Transformers, TCNs ou aprendizado auto-supervisionado, ausência de validação externa, escores MDS-UPDRS pareados e baixa sensibilidade para a classe Other Movement Disorders (41,2%)."
    status: "explícito"
    confianca: "alta"
    evidencia: "Seção 6.7, p. 22 — 'Several limitations should be considered when interpreting the present findings. First, although both pipelines were evaluated using five-fold patient-level cross-validation...'"
    auditoria: "CONCORDA"
    observacao: null
