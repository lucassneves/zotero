pontos_para_revisao_humana:
  - "Campo 2 (ano_publicacao): cabeçalho indica 'Biomedical Signal Processing and Control 130 (2027) 111448', mas DOI (10.1016/j.bspc.2026.111448), data de disponibilização online (1 October 2026) e copyright (© 2026) indicam 2026; preenchido '2026' conforme regra do guia."
  - "Campo 9 (tarefas_pads): status 'inferido' como 'Todas' porque o estudo utiliza todas as 5159 sessões de medição dos 469 sujeitos (11 tarefas por sujeito) e cita exemplos de tarefas na Seção 3.1, sem listar todas as 11 nominalmente."
  - "Campo 13 (punhos): menciona que os participantes usaram smartwatches em ambos os punhos nas 5159 sessões e extrai 6 canais por gravação (3 eixos acelerômetro + 3 giroscópio), agregando todas as gravações do paciente."
  - "Campo 23 (balanceamento_augmentation): marcado 'Outro' pois nos pipelines principais o desbalanceamento é tratado via pesos de classe/amostra inversamente proporcionais à frequência no treino, enquanto SMOTE (k=5 no treino) foi usado apenas nos estágios auxiliares demográficos (Stages 0 e 1)."
  - "QA3 e aux_preproc_apenas_treino: classificado como 'Sim' e risco 'Baixo' dado o rigoroso protocolo patient-disjoint (normalização z-score, pesos, early stopping e calibração isotônica feitos apenas no treino externo); notar apenas que a razão 60:40 do ensemble e a exclusão de 10 variáveis cross-axis vieram de análise exploratória/heurística de desenvolvimento."
  - "QA5: nota 0.5 ('Partially') pois embora o artigo descreva exaustivamente a arquitetura, equações, hiperparâmetros e ambiente de software, o código não está em repositório público ('available from the corresponding author on reasonable request')."
