pontos_para_revisao_humana:
  - "Campo 14 (n_participantes = 355): status inferido a partir da Tabela I (PD=276, HC=79, DD=114) combinada com a exclusão explícita do grupo DD na Seção II-B (p. 3)."
  - "Campos 24, 26, 27, 28 e QA3: o artigo não descreve a estratégia de validação (split treino/teste ou validação cruzada) nem deixa explícito se o up-sampling por duplicação aleatória foi feito antes ou depois da divisão."
  - "Campo 31 e QA4: o artigo reporta Accuracy e F1-Score sem especificar se o F1 é macro, ponderado ou binário."
  - "QA5: não há disponibilização de código nem relato dos hiperparâmetros selecionados via grid search ou da configuração numérica das camadas de CNN e CNN-LSTM."
