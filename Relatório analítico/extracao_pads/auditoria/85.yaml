  - id: 36
    chave: "limitacoes"
    valor: "Exclusão do grupo de diagnósticos diferenciais (DD) para evitar a complexidade de classificação multiclasse (Seção II-B, p. 3); técnicas de geração sintética (SMOTE e ADASYN) tiveram desempenho inferior ao up-sampling simples por possivelmente não capturarem padrões reais de PD (Seção III, p. 4); modelos de deep learning não superaram consistentemente os modelos tradicionais em todas as tarefas (Seção III, p. 5); tarefas complexas como 'Entrainment' exigem maior coordenação física e podem ser inadequadas para idosos ou pessoas com mobilidade reduzida, enquanto tarefas simples como 'Resting' têm menor desempenho preditivo (Seção III, p. 5); necessidade de validação em datasets maiores, demograficamente diversos e com diferentes modelos de smartwatches (Seção IV, p. 5)."
