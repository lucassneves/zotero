  qa:
    QA1:
      resposta: "Partially"
      nota: 0.5
      campos: [16, 15]
      justificativa: "O cenário binário (PD vs. No PD) é citado, mas não há N por classe nem clareza sobre se o grupo DD foi unido a HC ou excluído (além do uso de pseudo-rótulos via K-means na Seção 3.4)."
    QA2:
      resposta: "Partially"
      nota: 0.5
      campos: [8, 9, 11, 13, 14]
      justificativa: "Informa modalidade (8), sensores (11) e N total de participantes (14 = 469), mas não reporta quais tarefas (9) nem quais punhos (13) compõem os 10.318 sinais (3 de 5 itens informados)."
    QA3:
      resposta: "Partially"
      nota: 0.5
      campos: [26, 27, 28]
      justificativa: "Risco de vazamento Moderado: declara divisão por participante (5-fold subject-independent), mas não confirma que normalização/padronização e pré-rotulagem K-means foram restritas ao conjunto de treino."
    QA4:
      resposta: "Yes"
      nota: 1.0
      campos: [31]
      justificativa: "Reporta pelo menos duas métricas robustas ao desbalanceamento: AUC (0.9869 na Tabela 5) e Balanced Accuracy (0.8344 e 0.9144 nas Tabelas 3 e 4)."
    QA5:
      resposta: "No"
      nota: 0.0
      campos: [35, 22, 29]
      justificativa: "Código não disponível (campo 35 = Nenhum) e hiperparâmetros essenciais da arquitetura (filtros/kernels da CNN, camadas/cabeças/dimensão do Transformer, learning rate, batch size, K do K-means, wavelet-mãe) não são descritos."
