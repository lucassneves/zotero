  - id: 36
    chave: "limitacoes"
    valor: "Seções 5 e 6 (p. 17): (1) uso de um único dataset (PADS), que pode não representar toda a diversidade populacional, de estágios e condições clínicas da DP, além de metadados incompletos sobre estado medicamentoso e gravidade dos sintomas; (2) avaliação apenas computacional dos mapas de atribuição do Integrated Gradients, sem validação clínica formal por neurologistas; (3) avaliação do módulo blockchain apenas em ambiente leve simulado, sem rede descentralizada real e diante de restrições de bateria/memória dos smartwatches; (4) ausência de simulações de escalabilidade em larga escala (centenas/milhares de dispositivos); (5) maior complexidade computacional e consumo de memória do componente Transformer para dispositivos de borda."
    status: "explícito"
    confianca: "alta"
    evidencia: "Seção 6, p. 17 — 'several limitations should be acknowledged. First, the study was conducted using the PADS smartwatch dataset...'"
    auditoria: null
    observacao: null
  - id: 37
    chave: "lacuna"
    valor: "Seção 1.1 (p. 3) e Seção 6 (p. 17): Os autores apontam que estudos prévios focam isoladamente em acurácia preditiva com atributos manuais ou CNNs locais (incapazes de capturar dependências temporais de longo alcance), operam como caixas-pretas sem explicabilidade (XAI) e usam arquiteturas centralizadas vulneráveis a adulteração de dados. Como trabalhos futuros (Seção 6), indicam validação em coortes multicêntricas maiores, modelagem sensível à medicação e ao estágio da doença, validação clínica por especialistas das explicações XAI, implantação real de blockchain assistida por borda/nuvem com consenso leve e compressão/quantização de modelos Transformer."
    status: "explícito"
    confianca: "alta"
    evidencia: "Seção 1.1, p. 3 — 'Developing unified frameworks that simultaneously address predictive accuracy, interpretability, and data integrity therefore remains an open research challenge.'"
    auditoria: null
