pontos_para_revisao_humana:
  - "Campos 15, 16 e 17 (Amostra e cenário PD vs. No PD): O artigo menciona 469 sujeitos e 3 grupos na Fig. 2 ('0=Healthy, 1=PD, 2=Other'), mas formula uma tarefa binária 'PD vs. No PD' em N = 10.318 sinais e descreve na Seção 3.4 geração não supervisionada de pseudo-rótulos via K-Means; além disso, na matriz de confusão (Fig. 6, p. 12, N = 2.064), a classe 1 tem apenas 154 amostras (~7,5%) contra 1.910 da classe 0."
  - "Campos 26, 27, aux_preproc_apenas_treino e QA3: O artigo declara explicitamente 'subject-independent 5-fold cross-validation' (Seções 3.2.1 e 4.1), mas no Algoritmo 1 (p. 11) e nas Seções 3.4–3.5 a normalização, padronização e clusterização K-Means aparecem aplicadas sobre o dataset D antes do treinamento; se o revisor considerar que o K-Means/normalização ocorreu antes do split entre sujeitos, alterar aux_preproc_apenas_treino para 'Não' (o que muda risco_vazamento para 'Alto' e QA3 para 0.0)."
  - "Campo 24 (Estratégia de validação): O texto reporta 5-fold CV (Figs. 9–10), porém a matriz de confusão (Fig. 6) e o cálculo do IC 95% (Eq. 32) somam N = 2.064 amostras, o que corresponde a apenas 1/5 do total de N = 10.318 sinais (um único fold de teste), enquanto a Seção 4.7 menciona 'five independent runs'."
  - "Campos 31, 33 e 34 (Métricas na Tabela 2 vs. Fig. 6 e Tabelas 3–4): Na Tabela 2 (modelo proposto), Accuracy (0.972868) e Recall (0.972868) são idênticos porque os autores usaram média ponderada ('weighted-average', Seção 4, p. 11); calculando diretamente da matriz de confusão da Fig. 6 (TN=1861, FP=49, FN=28, TP=126), o recall da classe 1 é 126/154 = 81,82%, a precisão da classe 1 é 126/175 = 72,00% e a acurácia balanceada é 89,62% (inferior aos 91,44% reportados na Tabela 4 para a ablação sem blockchain)."
  - "Campo 35 e QA5 (Reprodutibilidade): Não há código disponível e faltam hiperparâmetros essenciais da rede (número de camadas/filtros/kernels da CNN, cabeças/dimensões do Transformer, learning rate, batch size, número K de clusters e família da wavelet)."
