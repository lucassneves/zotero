derivados:
  aux_preproc_apenas_treino:
    valor: "Não reportado"
    status: "não reportado"
    confianca: "alta"
    evidencia: "Seção IV-B, p. 5 — 'All models were trained using early stopping based on validation set performance. In the data preprocessing stage, the raw signals were segmented...'"
    observacao: "O artigo não detalha se houve normalização estatística dos sinais ajustada apenas nas dobras de treino, como o conjunto de validação para early stopping foi separado em cada fold, nem como foram extraídos/selecionados os atributos do baseline LGBM."
  risco_vazamento:
    valor: "Moderado"
    regra: "campo 26 = Participante; campo 27 = Sim – explícita; campo 28 = Não se aplica; aux_preproc_apenas_treino = Não reportado"
  qa:
    QA1:
      resposta: "Yes"
      nota: 1.0
      campos: [16, 15]
      justificativa: "O cenário binário PD×DD no PADS está claramente definido, especificando explicitamente que entram apenas pacientes com DP e Diagnóstico Diferencial."
    QA2:
      resposta: "Partially"
      nota: 0.5
      campos: [8, 9, 11, 13, 14]
      justificativa: "Informa modalidade (IMU), tarefas (11 atividades listadas) e sensores (6 canais de aceleração e velocidade angular), mas omite o punho utilizado e o N de participantes."
    QA3:
      resposta: "Partially"
      nota: 0.5
      campos: [26, 27, 28]
      justificativa: "A validação 4-fold separa explicitamente por participante, mas não há informação sobre isolamento do pré-processamento e do conjunto de early stopping apenas no treino (risco Moderado)."
    QA4:
      resposta: "Partially"
      nota: 0.5
      campos: [31]
      justificativa: "Reporta F1 explicitamente como Macro-F1 (uma métrica robusta da lista); reporta também Macro-Recall (que no caso binário equivale à Balanced accuracy, embora não nomeada como tal)."
    QA5:
      resposta: "Partially"
      nota: 0.5
      campos: [35, 22, 29]
      justificativa: "Descreve a arquitetura MFAM, baselines, pré-processamento (janelas de 1s com 50% de sobreposição, bandas de frequência) e hiperparâmetros principais, mas não disponibiliza código."
  nota_qa: 3.0
  nota_qa_max: 5
  faixa_qa: "Média"
