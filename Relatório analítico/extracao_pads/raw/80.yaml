    resultado: "OK (ambos null por não serem reportados)"
  - regra: "Campo 26 = Participante → campo 27 = Sim – explícita ou Sim – inferida"
    resultado: "OK (campo 26 = Participante e campo 27 = Sim – explícita)"
  - regra: "Campo 23 = Nenhum ou Não se aplica → campo 28 = Não se aplica e campo 29 null"
    resultado: "OK (campo 23 = Nenhum, campo 28 = Não se aplica e campo 29 = null)"
  - regra: "Campo 9 != Não se aplica → campo 10 preenchido"
    resultado: "OK (campo 9 = Subconjunto e campo 10 lista as 11 tarefas)"
  - regra: "Cada Outro/Outra marcado ↔ campo de texto preenchido"
    resultado: "OK (apenas campo 6 marcou Privado-próprio e preencheu campo 7)"
  - regra: "A nota de QA3 deve ser coerente com o risco_vazamento calculado"
    resultado: "OK (risco_vazamento = Moderado → QA3 = Partially / 0.5)"
pontos_para_revisao_humana:
  - "Campo 11 (sensores): status inferido (confiança média); na descrição do PADS (Seção IV-A, p. 5) cita-se 'also containing 6-channel motion signals', cuja especificação como acelerômetro e giroscópio triaxial aparece logo abaixo na descrição do dataset privado."
  - "Campos 13, 14 e 15 (punhos, n_participantes, n_por_classe): o artigo não reporta qual punho do PADS foi usado nem a quantidade total ou por classe (PD e DD) de participantes."
  - "Campo 23 (balanceamento_augmentation): status inferido como 'Nenhum' pois a seção de pré-processamento e implementação (Seção IV-B, p. 5) não menciona técnicas de balanceamento ou augmentation."
  - "QA3 e aux_preproc_apenas_treino: embora a divisão 4-fold CV seja explicitamente por participante ('divided all participants (not data segments) into 4 groups'), não é reportado como o conjunto de validação para early stopping foi separado nem se houve normalização ajustada apenas no treino."
  - "Campo 31 e QA4: o artigo reporta Macro-Recall e Macro-F1; em classificação binária (PD×DD), Macro-Recall é matematicamente idêntico à Balanced accuracy, podendo elevar QA4 para 'Yes' (1.0) caso o revisor considere Macro-Recall binário como Balanced accuracy."
  - "Campo 33 (melhor_resultado): como o artigo treina/avalia por atividade (11 atividades na Tabela I) sem reportar uma média geral no PADS, foi extraído o melhor resultado do MFAM (tarefa CrossArms: Acc 81.29%, Macro-F1 75.45%) e listadas as demais tarefas no campo 34."
