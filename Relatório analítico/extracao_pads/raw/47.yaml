pontos_para_revisao_humana:
  - "Seção 4.5 (PADS): o artigo não explica como os dados de sensores vestíveis do PADS foram pré-processados/transformados em atributos tabulares nem como um pipeline desenhado para classificação binária de voz foi adaptado para 3 classes no PADS (Tabela 3, numerada como Tabela 4 no texto da p. 80)."
  - "Campos 26, 27, 28, 33 e QA3: vazamento severo de dados (data leakage) — RandomOverSampler é aplicado ao dataset completo antes da divisão 70/30 (Seção 3.3, p. 75 e Figura 1, p. 73), resultando em 83 amostras por classe no teste do PADS (249 amostras) e 100% em todas as métricas."
  - "Inconsistências internas graves no artigo: na Seção 4.3 (p. 78), o texto refere-se à curva ROC como 'lung cancer detection' / 'lung cancer diagnosis'; na Seção 4.5 (p. 80), a Figura 7 é intitulada 'ROC Curve of Stacking Ensemble Model on PADS Dataset', mas o gráfico exibe 'Calibration Curves (One-vs-Rest)'."
  - "Campos 8 e 11 (confiança baixa/média): a Seção 4.5 descreve o PADS como contendo dados de aceleração/rotação, metadados e sintomas não motores, afirmando ao final ter usado 'wearable sensor data', sem detalhar exatamente quais variáveis compuseram o vetor de entrada."
