  - id: 36
    chave: "limitacoes"
    valor: "1) Variações de conformidade ou fatores ambientais podem introduzir ruído nos sinais, que foram analisados sem filtragem explícita (Seção 2.1, p. 3; Seção 4.5, p. 11); 2) Menor validade ecológica das tarefas padronizadas em laboratório frente a flutuações motoras no mundo real (Seção 4.5, p. 11); 3) Baixo poder explicativo dos modelos (pseudo R² = 0,068 e R² ajustado = 0,0081), indicando que atributos de sensores isoladamente são insuficientes sem dados clínicos (Seção 4.5, p. 11); 4) Desbalanceamento demográfico (70,7% homens e 94,6% destros), limitando a generalização (Seção 4.5, p. 11); 5) Ausência de validação cruzada e de métricas de desempenho de classificação preditiva como acurácia, sensibilidade, especificidade, curvas ROC, AUC ou matrizes de confusão (Seções 1, 4.3 e 4.5, pp. 2, 10 e 11); 6) Desenho transversal, impedindo conclusões sobre progressão longitudinal (Seção 4.5, p. 11)."
    status: "explícito"
    confianca: "alta"
    evidencia: "Seção 4.5, p. 11 — 'variation in compliance or environmental factors may introduce noise... reduce ecological validity... modest amount of variance... demographic imbalance... lack of validation metrics... cross-sectional design'"
    auditoria: null
    observacao: null
