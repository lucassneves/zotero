pontos_para_revisao_humana:
  - "Inconsistência interna de N por subgrupo: a Seção 2 (p. 3) e a Seção 2.6 (p. 5) informam HC=89, PD=223, Other=46, Atypical=12, MS=45 e ET=54 (soma=469), enquanto o Resumo (p. 1), a Seção 3.1 (p. 5) e a Tabela 1 (p. 6) reportam HC=79, PD=276, Other=60, Atypical=15, MS=11 e ET=28 (soma=469, com DD=114)."
  - "Inconsistência na unidade de análise das regressões: a Seção 2.2 (p. 3) afirma que as médias e desvios-padrão foram mediados entre as 20 tarefas gerando 12 atributos por participante (N=469), e a Seção 2.6 diz que a regressão linear foi restrita ao subgrupo PD, porém a Tabela 2 (p. 6) e os graus de liberdade na Seção 3.4/3.5 (F(9, 6062) = 6.48, pp. 8–9) revelam que os modelos foram ajustados sobre N = 6.072 observações de tarefas sem correção para medidas repetidas do mesmo participante."
  - "Campo 13 (punhos): a Introdução (Seção 1, p. 3) menciona 'bilateral smartwatch-derived motor features', mas a Seção 2.1 (p. 3) especifica apenas 'left wrist' e a Seção 2.2 extrai apenas 6 eixos (um único punho)."
  - "Campos 24 a 28, QA3 e QA4: estudo realiza apenas regressão logística multinomial e regressão linear múltipla inferenciais (reportando β, p-valor, pseudo R² e R² ajustado), reconhecendo na Seção 4.5 (p. 11) a ausência de validação cruzada e de métricas preditivas (acurácia, sensibilidade, especificidade, ROC/AUC)."
  - "QA5 (nota 0.5): código e dados processados não estão em repositório aberto ('available upon reasonable request' na Seção 5, p. 12), embora os testes estatísticos e atributos estejam descritos."
