    valor: "Ambiguous Sample Augmenter (ASA): após o treino de M1 no conjunto de treino interno (D_inner-train), coleta as amostras mal classificadas (M) e agrupa as representações f_final^(1) via K-Means para selecionar amostras de fronteira (B, distância ao centroide mais próximo <= θ, ex.: 20º percentil), formando D_aug = D_inner-train ∪ M ∪ B com pesos adaptativos w_i (β para M, γ para B, max(β,γ) para M∩B, 1 para as demais)."
    status: "explícito"
    confianca: "alta"
    evidencia: "Seção II.C, Eq. (8)–(11), p. 2–3 (4292–4293) — 'clustered using K-Means, and samples with small distances to the nearest centroid (e.g., within the 20th percentile) are regarded as boundary samples... D_aug = D_inner-train ∪ M ∪ B'"
