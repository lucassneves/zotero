pontos_para_revisao_humana:
  - "Campos 26 e 27 (QA3): o artigo afirma adotar validação cruzada aninhada 5×5 'to obtain unbiased estimates and avoid data leakage' (Seção III.B, p. 3), mas não especifica se as dobras foram particionadas por participante (subject-wise) ou por janela/amostra."
  - "Campos 9, 11, 13, 14 e 15 (QA2): o artigo não detalha o recorte do PADS (N de participantes, N por classe, quais tarefas motoras, quais punhos ou se usou acelerômetro, giroscópio ou ambos)."
  - "Campo 31 e QA4: o artigo reporta 'macro-averaged Accuracy, Precision, Recall, and F1'; matematicamente, o Recall macro-averaged equivale à Balanced Accuracy, mas foi mantido apenas Sensitivity + F1 (macro) conforme o rótulo 'Recall' da Tabela I."
  - "Campo 33: foi registrado no campo 33 o resultado destacado no Abstract (3 classes: 80.85% Accuracy) e no campo 34 o maior valor absoluto no PADS (PD×HC: 94.37% Accuracy) e demais métricas."
  - "QA5: não há link de código nem descrição de janelamento, filtragem, normalização dos sinais ou hiperparâmetros de otimização (learning rate, batch size, épocas, pesos β e γ do ASA)."
