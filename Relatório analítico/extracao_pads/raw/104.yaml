  - id: 36
    chave: "limitacoes"
    valor: "Seção 4 (p. 13 e p. 15): menor desempenho no estágio avançado de PD (em MDVR-KCL) atribuído ao número reduzido de amostras nessa categoria; elevada taxa de falsos positivos no modelo de smartwatch (FP = 28.32%, priorizando sensibilidade de 98.27% sobre especificidade de 71.68%) e elevada taxa de falsos negativos no dataset de voz YouTubePD (FN = 17.07%) devido ao severo desbalanceamento de classes. Seção 5.2 (p. 17-19): visualizações Grad-CAM são geradas antes da fusão multimodal e projetadas no espaço de entrada, não conseguindo visualizar diretamente a geometria do espaço latente nem as restrições relacionais (distância e ângulo) aprendidas via RKD. Seção 7 (p. 21): a implementação prática atual depende de conexão com a internet para inferência assistida em nuvem (servidor CPU remoto), não estando ainda otimizada para execução totalmente on-device."
    status: "explícito"
    confianca: "alta"
    evidencia: "Seção 4, p. 15 — 'at the expense of higher FP rates (28.32% and 7.59%, respectively)' e Seção 7, p. 21 — 'relies on internet connectivity for cloud-assisted inference and is not yet optimized for fully on-device execution'"
    auditoria: null
    observacao: null
  - id: 37
    chave: "lacuna"
    valor: "Seção 1 (p. 2): estudos prévios em modalidades de baixo custo restringem-se a domínios isolados (apenas sinal bruto no tempo ou apenas frequência), sistemas multimodais exigem múltiplos dispositivos sensores na inferência (aumentando custo e complexidade operacional), e métodos convencionais de destilação de conhecimento exigem amostras pareadas entre modalidades, inexistindo frameworks capazes de transferir conhecimento estrutural clínico de neuroimagem (DaTscan) para sinais não clínicos unimodais sob condições totalmente não pareadas e entre sujeitos distintos. Seção 7 (p. 21): como trabalho futuro, otimizar o modelo para execução embarcada totalmente on-device em hardware móvel."
    status: "explícito"
    confianca: "alta"
    evidencia: "Seção 1, p. 2 — 'no prior work has explored knowledge transfer from clinical neuroimaging modalities to heterogeneous non-clinical signals in such an unpaired setting' e Seção 7, p. 21 — 'Further optimization for embedded and mobile AI hardware remains an important direction for future work.'"
    auditoria: null
    observacao: null
