pontos_para_revisao_humana:
  - "Campos 26 e 27 (status inferido, confiança média): a Seção 3.5.1 declara split 70:15:15 'to ensure fair evaluation and avoid data leakage' sem usar o termo 'subject-wise', mas a Tabela 2 (p. 4) e a Seção 3.3.2 (p. 9-10) confirmam que no PADS os 96 sinais das 16 sessões de cada pessoa formam uma única amostra empilhada (276 sujeitos PD = 276 amostras PD; 79 sujeitos HC = 79 amostras HC), garantindo 1 registro por participante."
  - "Campos 9 e 10 (confiança média): a Seção 2.3 menciona '11 neurologist-designed tasks' no PADS, enquanto a Seção 3.3.2 menciona 'all 16 experimental sessions, a total of 96 raw sensor signals' (16 × 6 canais = 96 sinais)."
  - "Campo 13: punho(s) não reportado explicitamente no texto, embora os 96 sinais correspondam a 16 sessões × 6 canais (acelerômetro e giroscópio triaxiais)."
  - "Campo 24: o método realiza split 70:15:15 (treino:validação:teste) repetido com 5 sementes aleatórias (Tabela 4), embora o texto da Seção 4 use ocasionalmente o termo 'folds' ao se referir às 5 repetições."
  - "Campo 33 e 34: na Tabela 4 (5 sementes), Proposed (With xReDA) obtém F1 = 93.60%±1.03% e Accuracy = 89.92%±2.02%, enquanto no estudo de ablação (Tabela 6 e Fig. 14b) reporta F1 = 93.16% e Accuracy = 90.64%."
  - "QA3 e aux_preproc_apenas_treino: ajuste de hiperparâmetros (α, β) e early stopping foram feitos no conjunto de validação (split 70:15:15), mas não há menção explícita sobre normalização estatística prévia dos sinais IMU."
  - "QA4 e Campo 31: além de Accuracy, Precision, Recall (Sensitivity) e F1 binário na Tabela 4, a Fig. 13(b) apresenta a matriz de confusão com TN (Specificity) = 71.68% e TP (Sensitivity) = 98.27%."
  - "QA5: arquitetura e hiperparâmetros estão bem documentados, mas não há repositório de código disponível ('Data will be made available on request')."
