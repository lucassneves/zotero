pontos_para_revisao_humana:
  - "Campo 15 (n_por_classe): a Tabela 2 do artigo (p. 7) reporta PD=295, DD=103 e HC=71 (soma = 469 sujeitos; 5.159 amostras = 469 × 11), números que divergem da distribuição canônica do PADS v1.0.0 (PD=276, HC=79, DD=114)."
  - "Campos 26 e 27 (unidade_particionamento e separacao_participante): marcados com status 'inferido' ('Participante' e 'Sim – inferida') porque a Seção 3.2 e a Seção 4.1 demonstram que os arquivos JSON são fundidos pelo ID único do sujeito formando 1 vetor multimodal de 90-D por participante (N = 469; ~13 pacientes de early-onset por fold de teste na Seção 5.3)."
  - "Campo aux_preproc_apenas_treino e QA3: embora as Seções 1 e 4.5 declarem ajuste de todo pré-processamento apenas no treino (e o BTE retreine autoencoders e GANs em cada fold), a Seção 5.1.3 sugere que no pipeline ETB os autoencoders não foram retreinados por fold; confirmar se isso deve alterar aux_preproc_apenas_treino para 'Não' ou 'Parcial'."
  - "Campo 28 (momento_balanceamento): o estudo avalia os modelos sob protocolo livre de vazamento ('Só no treino', Tabelas 4 e 5) e também simula o protocolo com vazamento ('Antes do split', Seção 6.3) para decompor o viés (+0.04 a +0.17 AUC)."
  - "Campo 35 (codigo_dados) e QA5: o texto afirma na Seção 6.3 que o software é liberado junto ao manuscrito, mas a seção 'Data and Code Availability' (p. 24) traz apenas o link do PhysioNet do PADS, sem URL de repositório de código."
  - "Campo 33 (melhor_resultado): extraído o maior valor da métrica primária (AUC = 0.842±0.043 para BTE + SMOTE + Random Forest no cenário binário PD vs. non-PD); para o baseline sem augmentation, BTE + NoAug + RF atingiu AUC = 0.841±0.041 e ETB + NoAug + RF atingiu AUC = 0.838±0.037 (F1 = 0.850±0.024)."
