  - id: 36
    chave: "limitacoes"
    valor: "Seção 6.4 (p. 21): (1) A qualidade da geração no espaço latente é limitada pelos autoencoders, pois informações descartadas na compressão (ex.: componentes sutis de frequência dos sensores) não são recuperadas pelo gerador; (2) geradores densos simples foram usados para dados tabulares e sensores comprimidos, exigindo arquiteturas 3D/convolucionais ou modelos de difusão para neuroimagem (MRI/DaTscan); (3) avaliação restrita a um único dataset (PADS) e uma única plataforma de smartwatch, sem teste de generalização externa; (4) estudo retrospectivo e puramente computacional, sem adjudicação clínica ou validação prospectiva human-in-the-loop."
    status: "explícito"
    confianca: "alta"
    evidencia: "Seção 6.4, p. 21 (PDF p. 22) — 'The quality of latent-space generation is bounded by the autoencoders... All results are obtained on a single dataset... retrospective, fully computational analysis'"
    auditoria: null
    observacao: null
  - id: 37
    chave: "lacuna"
    valor: "Seções 1 (p. 2) e 7 (p. 23): Falta de investigação sistemática sobre a ordem entre embedding e balanceamento em pipelines clínicos multimodais heterogêneos e ausência de auditoria de data leakage (split-after-augmentation) em estudos de augmentation generativo. Como trabalhos futuros (Seção 7, p. 23), apontam otimização conjunta do par encoder-gerador, uso de modelos generativos mais expressivos (como modelos de difusão), modelagem orientada à aquisição (acquisition-aware modeling) e validação prospectiva com colaboradores clínicos."
    status: "explícito"
    confianca: "alta"
    evidencia: "Seção 7, p. 23 (PDF p. 24) — 'Future work will focus on jointly optimizing the encoder-generator pairing, on stronger generative families such as diffusion models... and on a prospective evaluation'"
