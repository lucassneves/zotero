pontos_para_revisao_humana:
  - "Ressalva da triagem verificada: preprint no arXiv (arXiv:2605.08302v1) que realiza experimento completo no PADS (n=469: 419 em 5-fold subject-independent CV + 50 em blind test hold-out)."
  - "Campo 11/12 (sensores): o artigo descreve apenas 'two-wrist six-channel IMU recordings' sem citar nominalmente acelerômetro e giroscópio para o PADS; marcado como Outro ('IMU de 6 canais')."
  - "Campo 15 (n_por_classe): o artigo informa o total de 469 sujeitos (419+50) e o cenário de 3 classes (HC/PD/DD), mas não explicita o número de participantes em cada classe."
  - "Campo 24/26/27 e QA3: o estudo reporta dois pontos de operação no PADS (Visible_5fold_CV com n=419 e Hidden_50_subject_blind_test com n=50) e menciona 'V5c + clean retrain (no leak)' na ablação (Tabela 12), mas detalhes do pré-processamento de janelas/normalização do sinal IMU bruto remetem ao código suplementar (confiança média em aux_preproc_apenas_treino)."
  - "Campo 31 e QA4: o F1 reportado para o PADS (0.588 no 5-fold CV e 0.500 no blind test) não especifica se a agregação multiclasse foi macro ou ponderada."
  - "Campo 35 e QA5: o código é declarado como material suplementar anonimizado ('accompanies this submission'), sem link público direto no PDF do arXiv."
