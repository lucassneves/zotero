derivados:
  aux_preproc_apenas_treino:
    valor: "Sim"
    status: "explícito"
    confianca: "média"
    evidencia: "Seção 3.3, p. 5 e Seção 4.6, p. 8 — 'All thresholds are selected on the validation split... and frozen before held-out test evaluation' / 'hidden cohort did not participate in any training, hyperparameter tuning, or model selection'"
    observacao: "O artigo explicita isolamento estrito do conjunto de teste cego (n=50), congelamento de quantis na validação e retreinamento limpo sem vazamento ('V5c + clean retrain (no leak)', Tabela 12), embora detalhes matemáticos de normalização dos sinais brutos de IMU estejam apenas nos scripts suplementares."
  risco_vazamento:
    valor: "Baixo"
    regra: "campo 26 = Participante; campo 27 = Sim – explícita; campo 28 = Não se aplica; aux_preproc_apenas_treino = Sim"
  qa:
    QA1:
      resposta: "Yes"
      nota: 1.0
      campos: [16, 15]
      justificativa: "O cenário de 3 classes (HC/PD/DD) e o uso dos 469 participantes do PADS (419+50) estão explicitamente definidos, sem ambiguidade sobre os grupos incluídos."
    QA2:
      resposta: "Yes"
      nota: 1.0
      campos: [8, 9, 11, 13, 14]
      justificativa: "Todos os cinco itens aplicáveis do recorte do PADS (modalidade IMU, 11 tarefas, sensores IMU de 6 canais, ambos os punhos e N=469 participantes) são informados."
    QA3:
      resposta: "Yes"
      nota: 1.0
      campos: [26, 27, 28]
      justificativa: "Risco de vazamento Baixo: particionamento explícito por participante (5-fold subject-independent CV + 50-subject blind test) e seleção de hiperparâmetros/limiares isolada do teste."
    QA4:
      resposta: "Partially"
      nota: 0.5
      campos: [31]
      justificativa: "Reporta apenas uma métrica comprovadamente robusta ao desbalanceamento (AUC), além de F1 sem especificar se é macro ou ponderado."
    QA5:
      resposta: "Yes"
      nota: 1.0
      campos: [35, 22, 29]
      justificativa: "Declara disponibilização do código em repositório suplementar anonimizado e descreve modelos, função de perda, quantis de roteamento e hiperparâmetros de treinamento na Tabela 15."
  nota_qa: 4.5
  nota_qa_max: 5
  faixa_qa: "Alta"
