  - id: 29
    chave: "detalhes_balanceamento"
    valor: "Coverage-Aware Virtual IMU Augmentation (Ours): seleção de âncoras de diversidade (farthest-point sampling) e escassez (densidade local k-NN entre quantis Q_low e Q_high) no treino (com 20% de dados reais rotulados), extração de tempo/intensidade/periodicidade para prompts no T2M-GPT + IMUSim, geração de M=20 candidatos por âncora, retenção dos K_sel de menor custo (distância de cosseno no embedding + consistência de rótulo) e ponderação por tercis de risco e ranking intra-âncora (limite de 150 sequências por classe antes da segmentação); comparado com Traditional Augmentation (rotação, ruído gaussiano, bias), TimeGAN, Diffusion-TS e IMUGPT."
