pontos_para_revisao_humana:
  - "Ressalva da triagem confirmada: preprint no arXiv (arXiv:2609.16768v1) que utiliza o PADS na Seção IV-F como extensão médica exploratória (tarefas StretchHold e HoldWeight, ambos os punhos, 20% de dados reais rotulados, cenário PD×HC com RBF-SVM em 5-fold subject-wise split com CV interna)."
  - "Campos 14 e 15 (n_participantes e n_por_classe): o artigo omite o número total de participantes e o N por classe no PADS (na Tabela I informa apenas 'Folds: 5' em vez de 'Subjects', ao contrário dos outros 3 datasets)."
  - "Campo 18 (representacao_entrada): confiança média; o pipeline geral opera sobre janelas de série bruta (2 s a 20 Hz) e extrai atributos dinâmicos para prompts, mas a Seção IV-F não detalha se o RBF-SVM no PADS recebe as janelas brutas vetorizadas, embeddings do seed encoder ou atributos extraídos."
  - "Campos 24 a 28 e QA3: protocolo de validação no PADS é 5-fold CV no nível do sujeito com CV interna nos sujeitos de treino para ajuste de hiperparâmetros e geração virtual estritamente no treino (risco de vazamento Baixo)."
  - "Campo 35 e QA5: não há declaração de disponibilidade de código no artigo; hiperparâmetros do RBF-SVM são selecionados por CV interna sem listagem da grade exata de busca."
