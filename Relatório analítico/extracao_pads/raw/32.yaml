pontos_para_revisao_humana:
  - "Campos 5 e 30: O resumo refere-se a PADS e mPower como 'external cohorts to verify their validity' além da base própria (102 sujeitos), mas a Seção IV.B declara treino e teste independentes (split 80/20 por sujeito) em cada dataset e os três cenários do PADS são centrais no artigo."
  - "Campos 14 e 15: O artigo descreve os três grupos do PADS (PD, PL/DD e HC), mas não informa a quantidade de participantes utilizados em cada grupo no PADS."
