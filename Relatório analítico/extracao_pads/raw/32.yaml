    observacao: "O artigo descreve normalização dos dados brutos, janelamento deslizante, transformações e seleção de modelo via erro de reconstrução no conjunto de validação (além do cálculo do limiar mu nas amostras de treino no Algoritmo 1), mas não explicita se as estatísticas de normalização foram estimadas somente nos sujeitos de treino após o split nem como o conjunto de validação foi particionado."
  risco_vazamento:
    valor: "Moderado"
    regra: "campo 26 = Participante; campo 27 = Sim – explícita; campo 28 = Não reportado; aux_preproc_apenas_treino = Não reportado"
  qa:
    QA1:
      resposta: "Yes"
      nota: 1.0
      campos: [16, 15]
      justificativa: "Três cenários binários explícitos (HC vs. PD, PL vs. PD e HC+PL vs. PD) definindo claramente o papel dos três grupos do PADS (PD, PL/DD e HC)."
    QA2:
      resposta: "Partially"
      nota: 0.5
      campos: [8, 9, 11, 13, 14]
      justificativa: "Modalidade (8), tarefas (9), sensores (11) e punhos (13) são descritos, mas o número de participantes utilizados no PADS (14) não é reportado."
    QA3:
      resposta: "Partially"
      nota: 0.5
      campos: [26, 27, 28]
      justificativa: "Risco de vazamento Moderado: há separação explícita por participante (80/20), mas não é reportado se a normalização e as transformações ocorreram estritamente após o split."
    QA4:
      resposta: "Partially"
      nota: 0.5
      campos: [31]
      justificativa: "Reporta AUC (uma métrica robusta) e F1-score sem especificar se é macro ou ponderado, além de Accuracy."
    QA5:
      resposta: "Partially"
      nota: 0.5
      campos: [35, 22, 29]
      justificativa: "Descreve a arquitetura (CNN 1D + Transformer), hiperparâmetros (Adam, lr=0.001, 200 épocas, masking ratio=90%, dropout=0.1) e pré-processamento, mas não disponibiliza o código."
  nota_qa: 3.0
  nota_qa_max: 5
  faixa_qa: "Média"
