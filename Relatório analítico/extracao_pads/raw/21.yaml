derivados:
  aux_preproc_apenas_treino:
    valor: "Sim"
    status: "explícito"
    confianca: "alta"
    evidencia: "Seção IV.B e IV.E, p. 3 — 'features are z-score normalized in each subject' / 'parameter tuning... on the training partition with 5-fold inner cross-validation' / 'SMOTE oversampling was used only within the folds of training data'"
    observacao: "A normalização z-score é feita intrassujeito ('in each subject', sem cruzar estatísticas entre sujeitos de treino e de teste), e tanto o ajuste de hiperparâmetros (grid search com 5-fold CV interno) quanto o SMOTE foram aplicados exclusivamente nas partições de treino."
  risco_vazamento:
    valor: "Baixo"
    regra: "campo 26 = Participante; campo 27 = Sim – explícita; campo 28 = Só no treino; aux_preproc_apenas_treino = Sim"
  qa:
    QA1:
      resposta: "Yes"
      nota: 1.0
      campos: [16, 15]
      justificativa: "Os dois cenários binários (PD×HC e PD×DD) e os grupos do PADS que compõem cada tarefa estão claramente definidos na Seção IV.C, embora o N por classe (campo 15) não seja reportado."
    QA2:
      resposta: "No"
      nota: 0.0
      campos: [8, 9, 11, 13, 14]
      justificativa: "Apenas 2 dos 5 itens aplicáveis foram informados (modalidade e sensores); tarefas (campo 9), punho (campo 13) e N de participantes efetivamente usados por cenário (campo 14, citado apenas como 469 gravações totais do PADS) não foram reportados."
    QA3:
      resposta: "Yes"
      nota: 1.0
      campos: [26, 27, 28]
      justificativa: "Risco de vazamento Baixo: particionamento explícito no nível do participante (10-fold subject-level e LOSO), SMOTE restrito aos folds de treino e ajuste de hiperparâmetros na partição de treino."
    QA4:
      resposta: "Partially"
      nota: 0.5
      campos: [31]
      justificativa: "Reporta Accuracy e o par Sensitivity + Specificity (que conta como uma métrica robusta); embora a Seção IV.D mencione AUC, nenhum valor de AUC foi reportado na Tabela I ou no texto."
    QA5:
      resposta: "Partially"
      nota: 0.5
      campos: [35, 22, 29]
      justificativa: "Descreve a arquitetura, o pré-processamento e os hiperparâmetros (Seções III.B, IV.B e IV.E), mas o código não está disponível (prometido apenas para após a publicação, sem link)."
  nota_qa: 3.0
  nota_qa_max: 5
  faixa_qa: "Média"
