  - id: 36
    chave: "limitacoes"
    valor: "Coortes de diagnóstico diferencial (DD) relativamente pequenas, heterogêneas e demograficamente restritas nos dados abertos; gravações curtas de sessão única (em vez de monitoramento domiciliar longitudinal); número limitado de pacientes restringindo a generalização inter-sujeitos (menor acurácia em LOSO); e heterogeneidade de dispositivos entre estudos (IMUs de pesquisa vs. smartwatches comerciais) dificultando a generalização entre datasets (Seção V, p. 4–5)."
    status: "explícito"
    confianca: "alta"
    evidencia: "Seção V, p. 5 — 'The current pipeline is limited by the characteristics of the open data used, such as relatively small and demographically narrow DD cohorts, short recordings per single session... and device heterogeneity'"
    auditoria: null
