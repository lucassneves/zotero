pontos_para_revisao_humana:
  - "Campos 14 e 15 e QA2: a Seção IV.A (p. 3) menciona apenas '469 of smartwatch accelerometer and gyroscope recordings' como total do PADS, sem informar quantos participantes compõem cada classe (PD, HC, DD) ou cada tarefa binária (HC vs PD e PD vs DD). Por seguir a regra do campo 14 ('não o total do PADS; se reporta apenas gravações, use null'), o campo 14 ficou null e o QA2 ficou 'No' (0.0, 2/5 itens); caso o revisor considere 469 como N de participantes usados nos dois experimentos combinados, o QA2 sobe para 'Partially' (0.5, 3/5 itens)."
  - "Campos 24 a 28 e QA3: a Seção IV.E (p. 3) declara partições no nível do sujeito ('subject-level train/test partitions'), tuning por 5-fold CV interno na partição de treino e SMOTE restrito aos folds de treino, e a Seção IV.B indica normalização z-score por sujeito ('in each subject'). Contudo, na Figura 3 (p. 4), o diagrama posiciona o bloco de SMOTE antes do bloco de split treino/teste."
  - "Campo 31 e QA4: a Seção IV.D (p. 3) afirma que a Tabela I traz valores de AUC ('accuracy, sensitivity, specificity and area under the ROC curve (AUC)'), mas a Tabela I (p. 4) omite a coluna de AUC e traz apenas uma coluna de Sens. (%) e Spec. (%) (associadas no texto ao cenário HC vs PD em 10-fold CV)."
  - "Campo 33: resultados principais extraídos da Tabela I (p. 4): 95.3±1.1% (10-fold) / 92.7±1.7% (LOSO) em PD×HC e 90.0±2.0% (10-fold) / 86.6±2.6% (LOSO) em PD×DD para o modelo Proposed CNN–BiLSTM + Attention."
  - "Campo 35 e QA5: os autores informam na Seção IV.E (p. 3) que o código seria disponibilizado após a publicação ('will be provided after publishing'), sem fornecer link ou repositório."
