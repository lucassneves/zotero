pontos_para_revisao_humana:
  - "Campos 14 e 15 (n_participantes e n_por_classe): o artigo descreve os três grupos do PADS (PD, DD, HC), mas não informa nenhum número de participantes em todo o texto."
  - "Campos 26 e 27 (unidade_particionamento e separacao_participante): marcados com status 'inferido' porque o artigo usa exclusivamente o questionário PDNMS e declara que cada participante é representado por um único vetor binário de 30 dimensões (Seção III.A, p. 2)."
  - "aux_preproc_apenas_treino e QA3: embora o texto da Seção III.B (etapa 2, p. 3) declare que k=17 foi determinado maximizando a balanced accuracy via 5-fold CV no conjunto de treino ('on the training set'), a ordem numerada (etapa 2 antes da 3) e a Fig. 1 posicionam o SelectKBest antes do Stratified Train/Test Split (80%/20%); além disso, o SMOTE (etapa 4) foi aplicado à partição de treino antes do 5-fold CV de ajuste de hiperparâmetros (etapa 5)."
  - "Campo 31 e QA4: o artigo reporta F1-score nas Tabelas II e III sem especificar se a agregação é macro, ponderada ou binária na classe positiva."
  - "Campo 35 e QA5: Data Availability Statement (p. 6) cita apenas as referências originais do PADS [7], [23], [24], sem disponibilizar código."
