derivados:
  aux_preproc_apenas_treino:
    valor: "Sim"
    status: "explícito"
    confianca: "média"
    evidencia: "Seção III.B, p. 3 — 'The optimal k=17 features are retained, determined by grid search... maximizing 5-fold CV balanced accuracy on the training set.'"
    observacao: "O texto afirma que a escolha de k=17 (etapa 2), o SMOTE (etapa 4) e o ajuste de hiperparâmetros via 5-fold CV (etapa 5) foram realizados no conjunto de treino, mantendo o teste (20%) intocado. Contudo, na numeração das etapas (etapa 2 antes da etapa 3) e no fluxograma da Fig. 1, a caixa SelectKBest aparece antes do Stratified Train/Test Split (80%/20%), além de o SMOTE anteceder o 5-fold CV dentro do treino."
  risco_vazamento:
    valor: "Baixo"
    regra: "campo 26 = Participante; 27 = Sim – inferida; 28 = Só no treino; aux_preproc_apenas_treino = Sim"
  qa:
    QA1:
      resposta: "Yes"
      nota: 1.0
      campos: [16, 15]
      justificativa: "Os cenários binários (PD×HC e PD×DD) e os grupos do PADS envolvidos estão claramente definidos, embora o N numérico não seja reportado."
    QA2:
      resposta: "Partially"
      nota: 0.5
      campos: [8, 9, 11, 13, 14]
      justificativa: "Em estudo só com questionário avaliam-se modalidade (informada) e N de participantes (não reportado), atendendo 1 de 2 itens aplicáveis (50%)."
    QA3:
      resposta: "Yes"
      nota: 1.0
      campos: [26, 27, 28]
      justificativa: "Risco de vazamento calculado como Baixo (um vetor por participante, SMOTE restrito ao treino e seleção/tuning declarados no treino)."
    QA4:
      resposta: "Partially"
      nota: 0.5
      campos: [31]
      justificativa: "Reporta apenas uma métrica comprovadamente robusta ao desbalanceamento (Balanced accuracy), além de F1 sem especificar se é macro ou ponderado e Sensitivity sem Specificity."
    QA5:
      resposta: "Partially"
      nota: 0.5
      campos: [35, 22, 29]
      justificativa: "Modelos, hiperparâmetros (Tabela I) e pré-processamento estão descritos, mas o código não está disponível (campo 35 = Nenhum)."
  nota_qa: 3.5
  nota_qa_max: 5
  faixa_qa: "Média"
