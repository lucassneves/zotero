pontos_para_revisao_humana:
  - "Campo 13 (punhos): o artigo menciona dados de IMU do Apple Watch Series 4 e inclui 'Handedness' como metadado na Tabela 1, mas não explicita qual punho (esquerdo, direito ou ambos) do PADS foi utilizado."
  - "Campo 18 e 20 (representacao_entrada e familia_algoritmo): o modelo no PADS é uma 1D CNN (Deep Learning), porém a entrada descrita na Seção IV-A3 e Tabela 1 não é a série temporal bruta, e sim um vetor tabular de 22 atributos extraídos por janela (16 atributos estatísticos/espectrais de IMU + 3 demográficos + 3 flags one-hot de tarefa)."
  - "Campo 23 (balanceamento_augmentation): status inferido ('Nenhum'); no módulo PADS o desbalanceamento (276 PD vs. 79 HC) é tratado apenas no pós-processamento via ajuste dos limiares t_w=0,560 (Youden's J) e t_s=0,44 (maximização da balanced accuracy)."
  - "Campo 24 (estrategia_validacao) e aux_preproc_apenas_treino: a Seção IV-A4 cita '5-fold Group K-Fold cross-validation with 80/20 patient-level stratified split' e deriva t_w e t_s durante a 5-fold Group K-Fold CV; verificar se 80/20 refere-se apenas à proporção 4:1 das 5 dobras ou a um hold-out separado, e notar que não é informado se o standard-scaling no PADS foi ajustado apenas no treino."
  - "QA5: avaliado como 'No' (0.0) pois o código não está disponível e a arquitetura detalhada/hiperparâmetros de treino da 1D CNN não são informados (embora pré-processamento, atributos da Tabela 1, quantização 8-bit e limiares t_w e t_s estejam descritos)."
