  - id: 36
    chave: "limitacoes"
    valor: "Seção VI, p. 6 (148) e Abstract, p. 1 (143): (1) módulos validados isoladamente em bases distintas de tamanhos muito diferentes (n=58 a n=4.267), tornando imperfeita a comparação direta dos pesos de fusão por AUC e sem validação unificada prospectiva; (2) mudança de domínio (domain shift) nos dados de treino pode reduzir o desempenho em diferentes populações e dispositivos (ex.: treino no Apple Watch Series 4 do PADS vs. hardware próprio MPU-6050); (3) variabilidade de hardware de tela sensível ao toque e sensores IMU entre smartphones e vestíveis afeta a consistência; (4) plataforma destinada apenas a suporte de triagem para encaminhamento a especialista, e não a diagnóstico autônomo."
    status: "explícito"
    confianca: "alta"
    evidencia: "Seção VI, p. 6 (148) — 'Training data domain shift may reduce performance across different populations and devices; touch and IMU hardware variability... and the AUC fusion weights are derived from datasets of vastly different sizes'"
    auditoria: null
    observacao: null
  - id: 37
    chave: "lacuna"
    valor: "Seção II, p. 1–2 (143–144) e Seção VII, p. 6 (148): Destacam que a aplicação de redes neurais quantizadas em microcontroladores (TinyML) para DP é pouco explorada e que plataformas multimodais costumam restringir-se a pipelines offline. Como trabalhos futuros, apontam: (1) validação clínica prospectiva unificada com ≥500 sujeitos completando as quatro modalidades; (2) calibração dos limiares de fusão com dados multicêntricos; (3) estudos de usabilidade no mundo real em grupos demográficos diversos; (4) integração de variabilidade da frequência cardíaca baseada em PPG para avaliação de disfunção autonômica; e (5) aprendizado federado (federated learning) para atualização de modelos preservando a privacidade."
    status: "explícito"
    confianca: "alta"
    evidencia: "Seção VII, p. 6 (148) — 'Future work will focus on: (1) prospective unified validation with ≥500 subjects completing all four modalities; (2) calibration of fusion thresholds using multi-center data...'"
    auditoria: null
