derivados:
  aux_preproc_apenas_treino:
    valor: "Não reportado"
    status: "não reportado"
    confianca: "alta"
    evidencia: "Seção IV-A3 e IV-A4, p. 2–3 (144–145) — 'All numeric features are standard-scaled on-device using pre-computed constants' e 'To eliminate bias, the optimal classification thresholds were mathematically derived during 5-fold Group K-Fold cross-validation.'"
    observacao: "Embora o artigo explicite nos módulos de desenho (Seção IV-B4) e cognitivo (Seção IV-D3) que a padronização/estatísticas foram ajustadas exclusivamente nas dobras de treino, no módulo do PADS (Seção IV-A) não informa se as constantes de standard-scaling foram calculadas apenas nas partições de treino de cada dobra, além de haver ambiguidade sobre se a otimização dos limiares t_w e t_s na CV de 5 dobras foi avaliada nas mesmas dobras ou em um conjunto held-out independente."
  risco_vazamento:
    valor: "Moderado"
    regra: "campo 26 = Participante; 27 = Sim – explícita; 28 = Não se aplica; aux_preproc_apenas_treino = Não reportado"
  qa:
    QA1:
      resposta: "Yes"
      nota: 1.0
      campos: [16, 15]
      justificativa: "Cenário binário PD×HC explícito, informando a exclusão dos 114 sujeitos de diagnóstico diferencial (DD) e o N exato por grupo (276 PD e 79 HC)."
    QA2:
      resposta: "Partially"
      nota: 0.5
      campos: [8, 9, 11, 13, 14]
      justificativa: "Informa 4 dos 5 itens aplicáveis do recorte do PADS (modalidades, mapeamento das tarefas, sensores e N=355), mas não reporta qual punho foi utilizado (campo 13 = Não reportado)."
    QA3:
      resposta: "Partially"
      nota: 0.5
      campos: [26, 27, 28]
      justificativa: "Risco de vazamento Moderado: há separação explícita por participante (Group K-Fold / patient-level split), mas não é reportado se as constantes de normalização no módulo do PADS foram ajustadas apenas no conjunto de treino."
    QA4:
      resposta: "Yes"
      nota: 1.0
      campos: [31]
      justificativa: "Reporta três métricas robustas ao desbalanceamento de classes: Balanced accuracy, AUC e o par Sensitivity + Specificity."
    QA5:
      resposta: "No"
      nota: 0.0
      campos: [35, 22, 29]
      justificativa: "Código não disponível (Não reportado) e a arquitetura interna/hiperparâmetros de treinamento da 1D CNN (camadas, filtros, tamanho de kernel, otimizador, épocas) não são descritos, embora o pré-processamento e os limiares de decisão sejam detalhados."
  nota_qa: 3.0
  nota_qa_max: 5
  faixa_qa: "Média"
