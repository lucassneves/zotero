pontos_para_revisao_humana:
  - "Campo 15 (n_por_classe): Na Tabela 1 (p. 354), os autores inverteram os tamanhos conhecidos das classes HC (reportado 114) e DD (reportado 79) do PADS. Além disso, na Figura 5b (p. 359), os rótulos das linhas da matriz de confusão PD vs. DD estão trocados (linha DD soma 276 e linha PD soma 114)."
  - "Campos 9 e 10 (tarefas_pads / quais_tarefas_pads): O artigo menciona 'multi-task recordings' mas não lista quais ou quantas tarefas do PADS foram incluídas no pipeline (apenas 5 nomes de tarefas aparecem nos nomes de atributos da Figura 6)."
  - "Campo 22 (especificacao_algoritmo): CatBoost (CB) é citado no Abstract e na Seção 4.6 como avaliado, mas não aparece na Tabela 2 de resultados."
  - "QA5 (replicabilidade): Apesar de descrever bem o pré-processamento e a validação aninhada (Seções 4.1 a 4.7), o estudo não disponibiliza código e não informa os hiperparâmetros avaliados no grid search."
