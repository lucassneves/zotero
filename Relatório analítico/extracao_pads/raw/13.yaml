derivados:
  aux_preproc_apenas_treino:
    valor: "Não reportado"
    status: "não reportado"
    confianca: "alta"
    evidencia: "Seção 3.2.3, p. 8; Seção 4, p. 9 — 'm is equal to 1.2245... considered as 0.2877 and 0.4700... learning rate of 1.52×10-3 and a weight decay of 3.75×10-3. Dropout with a rate of 0.384'"
    observacao: "Os centroides de classe (μHC,s e μPD,s) são explicitamente estimados apenas nos dados de treino de cada fold (Seção 3.3, p. 8 e Seção 4.1, p. 9). Contudo, o artigo reporta hiperparâmetros com alta precisão decimal (m=1.2245, λ1=0.2877, λ2=0.4700, lr=1.52e-3, weight decay=3.75e-3, dropout=0.384) sem descrever conjunto de validação separado ou CV aninhada (os 355 sujeitos são divididos diretamente em 284 treino e 71 teste por fold), não informando se o ajuste de hiperparâmetros utilizou os folds de teste."
  risco_vazamento:
    valor: "Moderado"
    regra: "campo 26 = Participante; 27 = Sim – explícita; 28 = Não se aplica; aux_preproc_apenas_treino = Não reportado"
  qa:
    QA1:
      resposta: "Yes"
      nota: 1.0
      campos: [16, 15]
      justificativa: "Cenário de classificação binária PD×HC explicitamente definido, com exclusão clara dos demais grupos e N por classe informado (276 PD e 79 HC)."
    QA2:
      resposta: "Yes"
      nota: 1.0
      campos: [8, 9, 11, 13, 14]
      justificativa: "Todos os cinco itens aplicáveis do recorte PADS (modalidade, todas as 11 tarefas nomeadas, sensores, ambos os punhos e N=355) estão descritos."
    QA3:
      resposta: "Partially"
      nota: 0.5
