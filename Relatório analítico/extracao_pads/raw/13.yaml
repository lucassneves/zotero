  - id: 36
    chave: "limitacoes"
    valor: "Ausência de escalas clínicas de severidade motora (como MDS-UPDRS Part III) no PADS, restringindo a análise ao uso do questionário NMS como proxy indireto (Seções 4.5 e 5, p. 13 e 16); menor número de amostras e alta variabilidade nas faixas superiores de NMS e de duração da doença (Seções 4.5 e 4.6, p. 13-14); modelo mais conservador na detecção de PD, com menor recall (80.79%, 53 falsos negativos) atribuído à heterogeneidade da doença e casos leves semelhantes a controles saudáveis (Seções 4.1 e 5, p. 10 e 16); substancial sobreposição do escore entre subtipos de PD por ausência de supervisão específica de subtipo no treino (Seções 4.7 e 5, p. 15-16)."
    status: "explícito"
