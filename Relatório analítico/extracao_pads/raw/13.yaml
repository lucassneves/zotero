pontos_para_revisao_humana:
  - "Ressalva da triagem confirmada: trata-se de preprint no medRxiv (setembro de 2026) cujo experimento primário é no PADS (N=355, PD×HC) com validação cruzada 5-fold explícita por participante."
  - "Campo aux_preproc_apenas_treino e QA3: embora os centroides sejam calculados estritamente nos sujeitos de treino de cada fold, os hiperparâmetros (m=1.2245, λ1=0.2877, λ2=0.4700, lr=1.52e-3, weight decay=3.75e-3, dropout=0.384) sugerem otimização prévia sem relato de conjunto de validação separado; verificar no repositório GitHub se houve tuning usando os folds de teste."
  - "Campos 23 e 28: não houve resampling da base de treino (63 HC e 221 PD por fold), mas cada mini-batch na fase de treino foi balanceado com 8 HC e 8 PD (Seção 4.1, p. 9); confirmar se prefere manter 'Nenhum' ou classificar a amostragem por batch como 'Outro' ('Só no treino')."
