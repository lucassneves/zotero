    QA4:
      resposta: "Yes"
      nota: 1.0
      campos: [31]
      justificativa: "Reporta pelo menos duas métricas robustas ao desbalanceamento de classes (Balanced accuracy e ROC-AUC), além de Precision, Recall e F1-score."
    QA5:
