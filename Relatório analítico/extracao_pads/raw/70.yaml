  - id: 37
    chave: "lacuna"
    valor: "Ausência prévia de um dataset público abrangente com avaliações interativas em smartwatches e anotações clínicas incluindo DP e diagnósticos diferenciais (DD) com n > 100 (Introduction, p. 1–2). Como trabalhos futuros: aumentar a amostra e regularizar espaços de atributos para melhorar a acurácia em PD vs. DD (Results, p. 5; Discussion, p. 6); realizar análise causal sistemática de variáveis de confusão e estudos comparativos com clínicos (Discussion, p. 6); implementar controle de qualidade automatizado para avaliações domiciliares (home-based) e testar configurações simplificadas com apenas um smartwatch (Discussion, p. 6); explorar transfer learning, predição de severidade/progressão longitudinal (trend biomarkers) e integrar novas modalidades como voz, desenho de espiral e finger-tapping (Discussion, p. 6)."
    status: "explícito"
