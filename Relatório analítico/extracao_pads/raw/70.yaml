pontos_para_revisao_humana:
  - "Artigo-semente (Regra 9): estudo criador do dataset PADS e do sistema de coleta SDS; status_triagem registrado como 'Incerto - texto completo' conforme entrada."
  - "Campo 9 (tarefas_pads): o dataset PADS publicado contém 11 tarefas (14 segmentos de 10 s), mas o artigo declara na p. 8 que removeu 3 etapas (steps 3, 5 e 8) na análise de ML com base em estudo prévio (ref. 41), utilizando 8 tarefas (11 segmentos). Marcado como 'Subconjunto'."
  - "Campo 23 e 28 (balanceamento_augmentation): o estudo utiliza sample weighting por gênero/classe na função de perda durante o treino e data augmentation (time warping e rotação de eixos) no treino de DL, além de avaliar um subconjunto de teste pareado por gênero via random under-sampling (n=234)."
  - "Campo aux_preproc_apenas_treino: marcado como 'Sim' pela validação cruzada aninhada 5×5 rigorosa (Figura 5), cabendo notar que a decisão de descartar as tarefas 3, 5 e 8 e metadados pessoais baseou-se em análises prévias do grupo (refs. 40 e 41)."
  - "QA4 (nota 0.5): o estudo utiliza Balanced accuracy como métrica principal e reporta F1, Precision e Recall (Sensitivity), mas o F1 reportado na Tabela 1 é binário sobre a classe positiva (sem indicação de macro-F1) e Specificity não é reportada isoladamente."
