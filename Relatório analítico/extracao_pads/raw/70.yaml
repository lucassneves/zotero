  - id: 36
    chave: "limitacoes"
    valor: "Desvio padrão relativamente alto entre dobras de teste (até 12.33% em PD vs. DD) devido ao tamanho limitado dos conjuntos de teste e possível overfitting em espaços de atributos grandes (Discussion, p. 6); estudo conduzido em centro único (single site), com potencial viés populacional ou de protocolo (Discussion, p. 6); ausência de escalas de estadiamento clínico como Hoehn & Yahr no dataset público (Discussion, p. 6); sub-representação do sexo masculino nos grupos controle em comparação ao grupo PD (Discussion, p. 6); avaliação transversal baseada em visita clínica única, sem capturar flutuações diárias dos sintomas (Discussion, p. 6; Methods, p. 7); qualidade dos dados dependente da supervisão presencial de enfermeira de estudo, o que pode diminuir em uso domiciliar não supervisionado (Discussion, p. 6); e impossibilidade de garantir 100% de acurácia nos rótulos clínicos sem confirmação histopatológica (Methods, p. 6–7)."
    status: "explícito"
    confianca: "alta"
